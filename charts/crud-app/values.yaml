# 默认值：本地 kind 集群 / 离线部署可直接使用
# 资源名前缀固定为 crud，方便离线包里的 manifests 与文档引用
nameOverride: ""
fullnameOverride: "crud"

# 镜像拉取策略：本地导入镜像的集群必须用 IfNotPresent
imagePullPolicy: IfNotPresent

backend:
  image:
    repository: crud-backend
    tag: v1
  replicas: 3
  port: 8080
  env:
    dbName: crud
    dbUser: crud
    # 首次启动是否插入演示数据
    seed: "true"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

frontend:
  image:
    repository: crud-frontend
    tag: v1
  replicas: 2
  port: 80
  service:
    # NodePort 让前端能从集群外直接访问，不依赖 kubectl port-forward
    # kind 集群已把节点端口 30080 映射到宿主机 8081（见 kind-config.yaml）
    type: NodePort
    # 当 type=NodePort 时生效；留空则由集群在 30000-32767 随机分配
    # 注意：kind 只映射了 30080 这一个端口，用到别的端口宿主机访问不到
    nodePort: 30080
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

mysql:
  image:
    repository: mysql
    tag: 8.0.36
  auth:
    # 演示用默认口令；生产请用 existingSecret 或 --set 覆盖
    rootPassword: root123456
    username: crud
    password: crud123456
    database: crud
    # 指定已有 Secret 名称（需含 mysql-root-password / mysql-password 两个 key），设置后 chart 不再创建 Secret
    existingSecret: ""
  persistence:
    enabled: true
    size: 2Gi
    # 留空使用集群默认 StorageClass
    storageClass: ""
    accessMode: ReadWriteOnce
  args:
    - --character-set-server=utf8mb4
    - --collation-server=utf8mb4_unicode_ci
    - --default-authentication-plugin=caching_sha2_password
  resources:
    requests:
      cpu: 100m
      memory: 320Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# 全局调度配置
nodeSelector: {}
tolerations: []
affinity: {}
